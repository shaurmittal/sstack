# Runs every rule's bad and good examples, and the lint-pack scripts' tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ast-grep-cli==0.51.3
      - name: Rule examples
        run: |
          for pack in rule-packs/*/; do
            (cd "$pack" && ast-grep test --skip-snapshot-tests)
          done
      - name: lint-pack script tests
        run: python -m unittest discover -s skills/lint-pack/scripts/tests -v
