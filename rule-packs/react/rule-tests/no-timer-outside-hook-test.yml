id: no-timer-outside-hook
valid:
  - |
    function useTimeout(fn: () => void, ms: number) { useEffect(() => { const id = setTimeout(fn, ms); return () => clearTimeout(id); }, [fn, ms]); }
  - |
    const useInterval = (fn: () => void) => { useEffect(() => { const id = window.setInterval(fn, 1000); return () => clearInterval(id); }, [fn]); };
invalid:
  - |
    function Toast() { setTimeout(() => {}, 1000); return null; }
  - |
    const Ticker = () => { const onClick = () => window.setInterval(() => {}, 10); return <button onClick={onClick} />; };
